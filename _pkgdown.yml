url: http://circumplex.jmgirard.com/
authors:
  Jeffrey Girard:
    href: https://www.jmgirard.com
  Johannes Zimmermann:
    href: https://www.uni-kassel.de/fb01/institute/psychologie/differentielle-psychologie/johannes-zimmermann-prof-dr.html
  Aidan Wright:
    href: https://www.personalityprocesses.com
template:
  bootstrap: 5
  bslib:
    preset: zephyr
  light-switch: true
# One site at the root, rebuilt from master on every push, so the published
# pages always match the current code (there is no separate /dev/ site).
development:
  mode: release
reference:
- title: Instrument Functions
  desc: Functions for importing and examining circumplex instruments
  contents:
  - instruments
  - scales
  - anchors
  - items
  - norms
- title: Tidying Functions
  desc: Functions for preparing data for analysis
  contents:
  - ipsatize
  - score
  - norm_standardize
  - self_standardize
- title: Primary SSM Functions
  desc: Functions for implementing the Structural Summary Method
  contents:
  - ssm_analyze
  - ssm_analyze_long
  - ssm_table
  - ssm_parameters
  - ssm_parameters_id
  - summary.circumplex_ssm_id
  - ssm_draws
  - ssm_score
- title: SEM-Based SSM Functions
  desc: Latent-variable (disattenuated) SSM via structural equation modeling
  contents:
  - ssm_sem
  - ssm_sem_parameters
  - ssm_sem_syntax
- title: Structure Evaluation Functions
  desc: Functions for evaluating circumplex structure and CI trustworthiness
  contents:
  - cpm_fit
  - cpm_simulate
  - print.circumplex_cpm
  - summary.circumplex_cpm
  - plot.circumplex_cpm
  - fit_structure
  - print.circumplex_structure
  - summary.circumplex_structure
  - plot.circumplex_structure
  - axes_reliability
  - print.circumplex_axes_reliability
  - summary.circumplex_axes_reliability
  - ssm_ci_accuracy
  - summary.circumplex_ci_accuracy
  - plot.circumplex_ci_accuracy
- title: Visualization - Complete Plots
  desc: Ready-made circumplex figures for a set of SSM results
  contents:
  - ssm_plot_circle
  - ssm_plot_curve
  - ssm_plot_contrast
  - ssm_plot_trajectory
- title: Visualization - Building Blocks
  desc: Composable ggplot2 components for building custom circumplex figures
  contents:
  - ggcircumplex
  - coord_circumplex
  - geom_ssm_point
  - geom_ssm_arc
  - geom_ssm_path
  - geom_ssm_ellipse
  - ssm_ellipse_data
  - scale_x_circumplex
  - theme_circumplex
- title: Secondary SSM Functions
  desc: Functions for customizing SSM results
  contents: html_render
- title: Convenience Functions
  desc: Functions that make your life easier
  contents:
  - angle_unwrap
  - octants
  - poles
  - quadrants
  - PANO
- title: Example Data
  contents:
  - aw2009
  - jz2017
  - raw_iipsc
  - simulated_items
  - simulated_occasions
  - simulated_growth
  - simulated_growth_origin
# The vignette index, grouped by level and in reading order within a level.
# tools/check-pkgdown-vignettes.R diffs it against vignettes/ and the level map
# in tests/testthat/helper-vignette-frame.R. Each group's `navbar:` key is the
# heading pkgdown puts over that group in the navbar's Articles dropdown, which
# pkgdown builds from this index: there is no hand-written vignette menu to
# keep in step. pkgdown emits a divider above every heading, the first one
# included (cairn/DESIGN.md accepted limitations).
articles:
- title: Introductory
  navbar: Introductory
  desc: Start here. Load an instrument, score its items, and run a first SSM analysis.
  contents:
  - using-instruments
  - introduction-to-ssm-analysis
- title: Intermediate
  navbar: Intermediate
  desc: Groups, measures, contrasts, and the checks an SSM analysis rests on.
  contents:
  - intermediate-ssm-analysis
  - evaluating-circumplex-structure
  - ci-accuracy
  - structure-tests
- title: Advanced
  navbar: Advanced
  desc: Boundary fits, custom figures, latent-variable models, Bayesian estimation, and growth models.
  contents:
  - cpm-boundary-fits
  - advanced-visualization
  - sem-based-ssm-analysis
  - sem-latent-contrasts
  - axes-reliability
  - axes-reliability-caveats
  - bayesian-ssm-analysis
  - growth-ssm-analysis
navbar:
  title: circumplex
  # There is no `navbar: left:` list: pkgdown's navbar_link_components() lets a
  # present one beat `structure:`, which would drop the generated Articles
  # menu. The two entries pkgdown has no component for are defined here, with
  # `news` redefined so its link keeps the label News rather than pkgdown's
  # Changelog, and `structure: left:` orders them with pkgdown's own reference
  # and articles components.
  components:
    news:
      text: News
      href: news/index.html
    home:
      icon: fa-home fa-lg
      href: index.html
    instruments:
      text: Instruments
      menu:
      - text: Child and Adolescent Interpersonal Survey
        href: reference/cais.html
      - text: Circumplex Scales of Interpersonal Efficacy
        href: reference/csie.html
      - text: Circumplex Scales of Intergroup Goals
        href: reference/csig.html
      - text: Circumplex Scales of Interpersonal Problems
        href: reference/csip.html
      - text: Circumplex Scales of Interpersonal Values
        href: reference/csiv.html
      - text: Interpersonal Emotion Inventory
        href: reference/iei.html
      - text: Interpersonal Goals Inventory for Children, Revised Version
        href: reference/igicr.html
      - text: Inventory of Interpersonal Problems, Brief Version
        href: reference/iip32.html
      - text: Inventory of Interpersonal Problems
        href: reference/iip64.html
      - text: Inventory of Interpersonal Problems, Short Circumplex
        href: reference/iipsc.html
      - text: Inventory of Interpersonal Strengths, Brief Version
        href: reference/iis32.html
      - text: Inventory of Interpersonal Strengths
        href: reference/iis64.html
      - text: Inventory of Influence Tactics Circumplex
        href: reference/iitc.html
      - text: IPIP Interpersonal Circumplex
        href: reference/ipipipc.html
      - text: Interpersonal Sensitivities Circumplex
        href: reference/isc.html
  # Both sides are pkgdown's own component lists, so the search box, the light
  # switch and the level-grouped Articles menu all come back. A hand-written
  # left: or right: list would drop them.
  structure:
    left: [home, reference, instruments, articles, news]
    right: [search, lightswitch, github]

