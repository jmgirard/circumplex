      index_name: circumplex
development:
  mode: auto
reference:
- title: Instrument Functions
  desc: Functions for importing and examining circumplex instruments
  contents:
  - instruments
  - scales
  - anchors
  - items
  - norms
- title: Tidying Functions
  desc: Functions for preparing data for analysis
  contents:
  - ipsatize
  - score
  - norm_standardize
  - self_standardize
- title: Primary SSM Functions
  desc: Functions for implementing the Structural Summary Method
  contents:
  - ssm_analyze
  - ssm_analyze_long
  - ssm_table
  - ssm_parameters
  - ssm_parameters_id
  - summary.circumplex_ssm_id
  - ssm_draws
  - ssm_score
- title: SEM-Based SSM Functions
  desc: Latent-variable (disattenuated) SSM via structural equation modeling
  contents:
  - ssm_sem
  - ssm_sem_parameters
  - ssm_sem_syntax
- title: Structure Evaluation Functions
  desc: Functions for evaluating circumplex structure and CI trustworthiness
  contents:
  - cpm_fit
  - cpm_simulate
  - print.circumplex_cpm
  - summary.circumplex_cpm
  - plot.circumplex_cpm
  - fit_structure
  - print.circumplex_structure
  - summary.circumplex_structure
  - plot.circumplex_structure
  - ssm_ci_accuracy
  - summary.circumplex_ci_accuracy
  - plot.circumplex_ci_accuracy
- title: Visualization - Complete Plots
  desc: Ready-made circumplex figures for a set of SSM results
  contents:
  - ssm_plot_circle
  - ssm_plot_curve
  - ssm_plot_contrast
  - ssm_plot_trajectory
- title: Visualization - Building Blocks
  desc: Composable ggplot2 components for building custom circumplex figures
  contents:
  - ggcircumplex
  - coord_circumplex
  - geom_ssm_point
  - geom_ssm_arc
  - scale_x_circumplex
  - theme_circumplex
- title: Secondary SSM Functions
  desc: Functions for customizing SSM results
  contents: html_render
- title: Convenience Functions
  desc: Functions that make your life easier
  contents:
  - angle_unwrap
  - octants
  - poles
  - quadrants
  - PANO
- title: Example Data
  contents:
  - aw2009
  - jz2017
  - raw_iipsc
