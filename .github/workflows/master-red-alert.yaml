# Open a GitHub issue when a push run of the checked workflows concludes
# failure on the default branch (cairn M96).
#
# Why a separate workflow rather than a failure step inside each watched
# workflow: the issue logic lives in one place, and this workflow cannot
# redden the run it is reporting on.
#
# `workflow_run` runs the version of THIS file that is on the default branch,
# with the default branch checked out — so nothing here fires from a pull
# request, and changes to it take effect only after they merge.
on:
  workflow_run:
    workflows:
      - R-CMD-check.yaml
      - test-coverage.yaml
    types:
      - completed

name: master-red-alert.yaml

# `issues: write` is the only write scope; `contents: read` is what
# actions/checkout needs to fetch this file's own script body.
permissions:
  contents: read
  issues: write

jobs:
  alert:
    # Three conditions, all read from the workflow_run payload: the run
    # failed, it was a push run (pull-request runs are already visible to
    # whoever opened the PR), and it was on the default branch.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the master-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALERT_WORKFLOW: ${{ github.event.workflow_run.name }}
          ALERT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          ALERT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ALERT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          LABEL='master-red'
          TITLE="master is red: ${ALERT_WORKFLOW}"

          # Every value below is a workflow_run payload field carried in via
          # the step `env:` above — nothing here is composed from anything
          # else. tools/check-master-red-alert.R enumerates these sites and
          # fails if one of them resolves to something other than the payload.
          BODY="$(cat <<EOF
          A push run of \`${ALERT_WORKFLOW}\` on the default branch concluded \`${ALERT_CONCLUSION}\`.

          | field | value |
          |---|---|
          | workflow | \`${ALERT_WORKFLOW}\` |
          | run | ${ALERT_RUN_URL} |
          | head SHA | \`${ALERT_HEAD_SHA}\` |
          | conclusion | \`${ALERT_CONCLUSION}\` |

          Close this issue once that workflow is green on the default branch
          again; nothing closes it automatically.
          EOF
          )"

          # Create the marker label if it is absent, BEFORE searching on it: a
          # search filtered on a label that does not exist returns empty, so a
          # missing label would silently defeat the dedupe below and open a
          # fresh issue on every failed push.
          if ! gh label list --json name --jq '.[].name' | grep -qx "$LABEL"; then
            gh label create "$LABEL" --color 'B60205' \
              --description 'A push run of a watched workflow failed on the default branch'
          fi

          # Dedupe is per watched workflow: the title carries the workflow
          # name, so a red R-CMD-check and a red test-coverage get one issue
          # each, while a red that persists across pushes gets one comment
          # per push on the issue it already has.
          EXISTING="$(gh issue list --state open --label "$LABEL" --json number,title |
            jq -r --arg t "$TITLE" '[.[] | select(.title == $t) | .number] | first // empty')"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
