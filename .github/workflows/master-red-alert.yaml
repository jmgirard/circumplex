# Open a GitHub issue when a push run of the checked workflows ends on the
# default branch in any way this repo does not treat as harmless (cairn M96,
# widened by M99 — see the job's `if:` for the list that stays quiet).
#
# The benign list in the job's `if:` below has a second reader: `cairn/PROFILE.md`'s
# consistency-gate master watch derives its own NO-verdict set from it — this list
# minus `success` — rather than restating it (cairn M100). Any edit to the list moves
# the review gate too, in whichever direction: adding a conclusion makes the gate walk
# past it, and removing one makes the gate call it red. `success` is the exception:
# subtracting it is what keeps a green run a verdict, so the gate is unmoved by its
# removal — but THIS workflow would then alert on every green push run of both
# watched workflows. Any edit here must also be made to `EXPECTED_IF` in
# `tools/check-master-red-alert.R`, which pins this expression independently and
# reddens until the two agree; that pin, not PROFILE.md, is the sibling to co-edit.
#
# Why a separate workflow rather than a failure step inside each watched
# workflow: the issue logic lives in one place, and this workflow cannot
# redden the run it is reporting on.
#
# `workflow_run` runs the version of THIS file that is on the default branch —
# so nothing here fires from a pull request, and changes to it take effect only
# after they merge. Nothing is checked out: the whole alert is this file's own
# `run:` body, which is why there is no `contents:` grant below.
#
# Two BROKEN watched workflows went unalerted in a PROBE of this configuration,
# not in this repo — measured 2026-08-21 local, the cited runs stamped
# 2026-08-22 UTC (cairn M101), in
# https://github.com/jmgirard/gha-startup-failure-probe, whose copy of
# this file was byte-identical to this repo's at commit 0b8863f7; the probe copy
# is not kept in sync after that. Two cases were driven on that repo's watched
# workflow, and for BOTH the outcome was "no event observed" — no alert run was
# created, so no alert job and no issue:
#   * YAML that does not parse —
#     https://github.com/jmgirard/gha-startup-failure-probe/actions/runs/32540432744
#   * parses and declares `name:` but fails schema validation, a job with no
#     `runs-on` —
#     https://github.com/jmgirard/gha-startup-failure-probe/actions/runs/32540622138
# Read the M101 result narrowly: an absent alert RUN does not by itself
# distinguish "no `workflow_run` event was delivered" from "an event was
# delivered and the `workflows:` filter below did not match it". Nothing M101
# measured separated the two — corrected M102, which did; see below.
# What those two runs do show: neither concluded `startup_failure`; both
# concluded `failure` with zero jobs; and GitHub reported each broken run's
# `name` as the PATH `.github/workflows/R-CMD-check.yaml`, while the probe's
# control — the same path holding a valid file that exited non-zero —
# https://github.com/jmgirard/gha-startup-failure-probe/actions/runs/32540381494
# reported the declared `R-CMD-check.yaml` and DID reach the alert (issue
# opened). In every M101 cell name and file validity varied TOGETHER, so name
# resolution stood there only as a correlation.
#
# M102 varied them INDEPENDENTLY on the same probe repo — measured 2026-08-21
# local, the cited runs stamped 2026-08-22 UTC — by adding a second
# `workflow_run` subscriber listing the PATH spelling
# `.github/workflows/R-CMD-check.yaml` and driving six more cells. The probe's
# copy of this file was re-verified first: its `on:` block byte-identical to
# this one and its job `if:` differing only in line numbers. Each cell's
# conclusion, job count and `name` are read from `gh run list`:
#   * valid, DECLARES `name:` — name = declared, `success`, 1 job; the
#     declared-name subscriber ran .../runs/32545892860
#   * valid, declares NO `name:` — name = PATH, `success`, 1 job; the PATH
#     subscriber RAN: .../runs/32545706555 produced .../runs/32545711782
#   * unparseable, M101 case (i) re-driven verbatim — name = PATH, `failure`,
#     0 jobs, NEITHER subscriber ran: .../runs/32545779577
#   * parses, declares `name:`, job `uses:` a nonexistent LOCAL reusable
#     workflow — name = PATH, `failure`, 0 jobs, neither ran:
#     .../runs/32545943649
#   * parses, declares `name:`, malformed expression in a job `if:` — name =
#     PATH, `failure`, 0 jobs, neither ran: .../runs/32545999116
#   * parses, declares `name:`, job `uses:` a reusable workflow in a nonexistent
#     EXTERNAL repo — name = PATH, `failure`, 0 jobs, neither ran:
#     .../runs/32546052474
# (Each `.../runs/N` above is
# https://github.com/jmgirard/gha-startup-failure-probe/actions/runs/N.)
#
# What that settles:
#   * A PATH spelling in `workflows:` DOES match. The valid-but-nameless cell
#     fired the path subscriber, so a silent path subscriber elsewhere is not a
#     subscriber that never works — that cell is this experiment's positive
#     control.
#   * Name resolution is NOT why a broken run goes unalerted. The nameless-valid
#     cell and every broken cell resolve to the SAME path; only the valid one
#     was matched.
#   * So a `workflows:`-side fix is RULED OUT for a run that fails to start: the
#     path spelling is exactly the one that would have matched the name GitHub
#     reports for those runs, and it did not fire. Either no `workflow_run`
#     event is delivered for such a run, or one is delivered carrying a name
#     different from the one the API reports for it. Adding spellings to the
#     list above will not close this gap. A scheduled sweep is the remaining
#     candidate remedy, and it is a ROADMAP candidate row, not a plan.
#   * The path fallback is BROADER than M99 assumed. M99 reasoned that an
#     unparseable file cannot declare the `name:` this filter matches — but the
#     last three cells above parse AND declare one, and their runs still
#     reported the path. Any run that fails to start reports the path.
#   * M99's `startup_failure` widening still has NO measured instance: M101's
#     two broken cells and M102's four broken cells above — six runs — every one
#     concluded `failure` with 0 jobs.
#     Three constructions aimed deliberately at `startup_failure` (the last
#     three cells) did not produce it; other constructions were not tried, so
#     this bounds what was driven, not what is possible.
on:
  workflow_run:
    workflows:
      - R-CMD-check.yaml
      - test-coverage.yaml
    types:
      - completed

name: master-red-alert.yaml

# Labels are issue-scoped, so `issues: write` covers every call the body
# makes. Naming a `permissions:` block at all drops every other scope to none.
permissions:
  issues: write

# Serialize alerts per watched workflow (never cancel one — a queued alert
# still needs to post). Without this, two pushes that redden the same workflow
# in quick succession can both search before either creates, and both open an
# issue with the same title.
concurrency:
  group: master-red-alert-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  alert:
    # Three conditions, all read from the workflow_run payload: the run did
    # not end in a way this repo treats as harmless, it was a push run
    # (pull-request runs are already visible to whoever opened the PR), and it
    # was on the default branch.
    #
    # The first condition admits by EXCLUSION, not by enumerating the bad
    # endings (cairn M99). An allowlist of `failure` was what left a timed-out
    # or never-started run silent; an allowlist of three would leave the next
    # ending GitHub invents silent in the same way. So the five conclusions
    # below are the whole of what stays quiet, and everything else — `failure`,
    # `timed_out`, `startup_failure`, `action_required`, anything added later —
    # opens an issue:
    #   * success        — the run passed; there is nothing to say.
    #   * cancelled      — a human or `cancel-in-progress` stopped it, so it
    #                      never reached a verdict on the branch.
    #   * skipped        — every job was skipped by a job-level condition, so
    #                      again no verdict, and not a red one. (A push
    #                      filtered out by `paths-ignore` produces no run at
    #                      all, hence no event here — that absence is what
    #                      PROFILE.md's coverage watch carves out, and it is
    #                      not this conclusion.)
    #   * neutral        — GitHub's explicit "completed without a verdict".
    #   * stale          — the run was superseded before it could report.
    # Every one of these is "no verdict" or "green", never "master is broken".
    # Read as an alert that would rather be noisy than silent: a spurious issue
    # is closed in a click, an unannounced red branch is what M96 existed for.
    if: >-
      !contains(fromJSON('["success","cancelled","skipped","neutral","stale"]'),
      github.event.workflow_run.conclusion) &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the master-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALERT_WORKFLOW: ${{ github.event.workflow_run.name }}
          ALERT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          ALERT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ALERT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          LABEL='master-red'
          TITLE="master is red: ${ALERT_WORKFLOW}"

          # Every value below is a workflow_run payload field carried in via
          # the step `env:` above. What checks that: check-master-red-alert.R
          # compares that `env:` block against the payload expressions, and
          # master-red-alert-dryrun.R compares the text this body hands to `gh`
          # against a committed template. Nothing scans this source — see the
          # audit script's header for why that was descoped.
          BODY="$(cat <<EOF
          A push run of \`${ALERT_WORKFLOW}\` on the default branch concluded \`${ALERT_CONCLUSION}\`.

          | field | value |
          |---|---|
          | workflow | \`${ALERT_WORKFLOW}\` |
          | run | ${ALERT_RUN_URL} |
          | head SHA | \`${ALERT_HEAD_SHA}\` |
          | conclusion | \`${ALERT_CONCLUSION}\` |

          Close this issue once that workflow is green on the default branch
          again; nothing closes it automatically.
          EOF
          )"

          # Create the marker label if it is absent, BEFORE searching on it: a
          # search filtered on a label that does not exist returns empty, so a
          # missing label would silently defeat the dedupe below and open a
          # fresh issue on every red push.
          #
          # Three things here are deliberate, and all three exist because this
          # job runs under `set -euo pipefail` — an abort anywhere in it means
          # no alert at all, in exactly the case the alert is for:
          #   * `--limit 200`, because `gh label list` returns 30 by default,
          #     and a repo past 30 labels would stop finding the marker;
          #   * a `case` over a captured string rather than a `... | grep -q`
          #     pipeline, because `grep -q` exits at the first match and can
          #     leave the producer with EPIPE, which `pipefail` then reports as
          #     a failed pipeline — reading as "absent" when it is present;
          #   * `--force` on the create, which updates instead of erroring when
          #     the label already exists. Two alert runs racing on the repo's
          #     first-ever failure would otherwise abort the loser.
          # Every GitHub call below is allowed to fail without taking the
          # alert down with it: this job runs only when master is already
          # broken, so an abort here means the failure goes unannounced. The
          # label is a convenience for deduping; the issue is the point.
          LABEL_OK=1
          LABELS="$(gh label list --limit 200 --json name --jq '.[].name')" || LABEL_OK=0
          if [ "$LABEL_OK" = 1 ] && [[ $'\n'"$LABELS"$'\n' != *$'\n'"$LABEL"$'\n'* ]]; then
            gh label create "$LABEL" --color 'B60205' --force \
              --description 'A push run of a watched workflow ended badly on the default branch' ||
              LABEL_OK=0
          fi

          if [ "$LABEL_OK" = 1 ]; then
            # Dedupe is per watched workflow: the title carries the workflow
            # name, so a red R-CMD-check and a red test-coverage get one issue
            # each, while a red that persists across pushes gets one comment
            # per push on the issue it already has.
            EXISTING="$(gh issue list --state open --label "$LABEL" --json number,title |
              jq -r --arg t "$TITLE" '[.[] | select(.title == $t) | .number] | first // empty')" ||
              EXISTING=""   # a failed search reads as "no match": this posts a
                            # duplicate rather than staying silent, deliberately

            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
            fi
          else
            # The label is unavailable — either listing it or creating it
            # failed — so it may not exist: a search filtered on it would
            # return empty, and `gh issue create --label` would refuse an
            # unknown label and take the alert down with it. Telling someone
            # master is red matters more than deduping, so post unlabeled and
            # say plainly that this one will not dedupe.
            echo "::warning::could not use the $LABEL label; posting an unlabeled alert that later failures will not dedupe against"
            gh issue create --title "$TITLE" --body "$BODY"
          fi
