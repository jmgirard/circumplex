# The vignettes ship pre-computed: vignettes/<name>.Rmd.orig holds the source,
# and the vignettes/<name>.Rmd that R CMD build sees already carries its output,
# so re-building a vignette costs no model fits. That makes the shipped .Rmd a
# generated file, and a generated file that nothing regenerates goes stale
# silently — the prose would keep describing output the code no longer produces.
#
# This job regenerates them from source and fails if the committed copies
# differ. Re-render locally and commit the result:
#
#     Rscript tools/precompute-vignettes.R
#
# Only the .Rmd files are compared, and by tools/check-vignette-staleness.R
# rather than a byte-exact `git diff`: one chunk's printed numbers are not
# reproducible across machines and the guard's header explains what that script
# masks and what it still holds byte-exact. tools/check-vignette-width.R then
# fails if any line inside a code fence is wider than 80 columns, other than
# the lines its EXEMPT list names. It reads the fresh render of each
# pre-computed vignette and knits each live vignette with the package this job
# installed. tools/check-vignette-width-plants.R then shows that the guard
# fails on each kind of line it reads. The figures under vignettes/figures/
# are SVGs whose bytes depend on svglite and the installed fonts, so they are
# not reproducible across machines either and are not compared at all.
# tools/check-ssm-applet.mjs last checks the introduction vignette's slider
# applet (vignettes/ssm-curve-applet.js) with Node, and
# tools/check-ssm-applet-plants.mjs shows that the check fails on each defect
# it is meant to catch.
#
# `cairn/**` is ignored: tracking-only commits cannot change a vignette.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
  workflow_dispatch:

name: vignette-precompute.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vignette-precompute:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Check CI dependency allowlists
        run: Rscript tools/check-ci-deps.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Same allowlist discipline as the other three workflows: a Suggest
          # missing here is never installed, its vignette chunks skip, and the
          # re-render would then match a committed copy built from LESS output
          # than the source asks for. The width guard also knits the live
          # vignettes here, so a missing Suggest would shorten what it reads
          # too. tools/check-ci-deps.R enforces the mirror.
          # brms alone is excluded — the Bayesian vignette's brm() chunk is
          # eval = FALSE against a committed .rds fixture (cairn D-015), so
          # the guard knits that vignette without it.
          dependencies: '"hard"'
          extra-packages: |
            local::.
            any::covr
            any::ggrepel
            any::glmmTMB
            any::kableExtra
            any::knitr
            any::lavaan
            any::nlme
            any::OpenMx
            any::psych
            any::RColorBrewer
            any::rmarkdown
            any::roxygen2
            any::svglite
            any::testthat
            any::vdiffr

      - name: Re-render the pre-computed vignettes
        run: Rscript tools/precompute-vignettes.R

      - name: Fail if a committed vignette is stale
        run: Rscript tools/check-vignette-staleness.R

      # Reads the fresh render, and knits the live vignettes. It runs even
      # when the staleness step failed, so a code change that both stales a
      # vignette and widens its output reports both. After a failed render it
      # reads the committed copy of each vignette that did not re-render.
      - name: Fail if vignette output is wider than the site's code box
        if: ${{ !cancelled() }}
        run: Rscript tools/check-vignette-width.R

      # Plants one wide line of each kind the width guard reads in a copy of
      # vignettes/ and fails unless the guard fails on every plant and passes
      # on the controls. It runs only when every step before it passed: after
      # a red guard its unchanged-tree control would only repeat that red.
      - name: Fail if the width guard misses a planted wide line
        run: Rscript tools/check-vignette-width-plants.R

      # The introduction vignette's slider applet is JavaScript, which no R
      # check runs. At every slider setting, this checks its curve, octant and
      # path functions against e + a * cos(theta - d), and its peak function
      # against the expected peak angles (none when a = 0). It also pins the
      # slider ranges, the linear axes and the readout formats. It uses the
      # runner's own Node.
      - name: Check the introduction vignette's SSM applet
        if: ${{ !cancelled() }}
        run: |
          node --version
          node tools/check-ssm-applet.mjs

      # Plants one defect of each kind the applet check reads in a copy of the
      # applet and fails unless the check fails on every plant, with that
      # rule's message, and passes on an unchanged copy.
      - name: Fail if the applet check misses a planted defect
        run: node tools/check-ssm-applet-plants.mjs
