# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# paths-ignore on BOTH triggers (cairn M58): a commit touching only tracking
# files, generated Rd, or the rendered README cannot change the site, and on
# push this workflow also deploys to gh-pages — so a cairn-only commit was
# rebuilding and redeploying the whole site for nothing. `**/*.Rmd` is
# deliberately NOT ignored: vignette sources are articles.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'man/**'
      - 'README.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'man/**'
      - 'README.md'
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

# Matches R-CMD-check.yaml / test-coverage.yaml (cairn M51). The previous
# job-level block keyed PRs on github.run_id — unique per run, so superseded
# PR runs never cancelled — and set no cancel-in-progress at all, so pushes
# merely queued behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Same allowlist discipline as R-CMD-check.yaml / test-coverage.yaml:
          # `needs: website` resolved ALL Suggests, which put brms and the whole
          # Stan stack (rstan/rstanarm/StanHeaders/RcppParallel/BH) into this
          # job's lockfile even though the site never needs them — the Bayesian
          # vignette's brm() chunk is eval = FALSE against a committed .rds
          # fixture (cairn D-015). glmmTMB/lavaan ARE needed: they evaluate the
          # growth, SEM and axes-reliability articles' fitting chunks, which
          # would otherwise publish as "package not installed" notes.
          # This list MUST stay a mirror of DESCRIPTION Suggests minus brms;
          # tools/check-ci-deps.R enforces that. See cairn milestone M58.
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::covr
            any::ggrepel
            any::glmmTMB
            any::kableExtra
            any::knitr
            any::lavaan
            any::OpenMx
            any::psych
            any::RColorBrewer
            any::rmarkdown
            any::roxygen2
            any::testthat
            any::vdiffr
            local::.

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
