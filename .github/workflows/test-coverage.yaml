# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Push to the default branch ONLY (cairn M95). This job ran on pull requests
# too, which meant every PR ran the whole suite twice — once under
# R-CMD-check.yaml and again here under covr instrumentation. The two ran in
# PARALLEL, so dropping this one saves runner minutes, not wall clock: measured
# 2026-08-18, this job was 27 min (run 32184165512) against 38 min for a
# three-platform check escalation (run 32184165497), and 27m19s for a plain
# single-platform check on PR #124 — i.e. neither job is reliably the long pole.
# No PR-side REPORTING is lost by stopping: codecov.yml sets `comment: false`
# and marks both statuses `informational: true`, so Codecov never commented on
# a PR and never gated one, and PROFILE.md's test-doctrine has always held the
# covr coverage NUMBER to be a diagnostic rather than a gate.
#
# What the PR side DID lose is this job's distinct test ENVIRONMENT. covr
# instruments the code, which perturbs optimizer results (M59) — that remains a
# live source of divergence from the check job. It also installs the package
# without vignettes; M92 is where CI caught that and no local run could, though
# M92's own remedy was to make the vignette-reading guards SKIP there, so that
# particular axis now skips rather than catches. Do not overstate what is left:
# the standing distinct signal is the instrumentation, not the vignette gap.
#
# That signal now lands only here, on master, after the merge. It is not
# unwatched: cairn/PROFILE.md's consistency-gate master watch reads this
# workflow's newest verdict-reaching push run on master. How a conclusion is
# classified is stated once, there, and deliberately not restated here (cairn
# M100) — a third copy is what M100 removed. A red here therefore fails the
# NEXT milestone's review gate, never the one that introduced it.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'man/**'
      - 'README.md'

name: test-coverage.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # brms is deliberately excluded (see R-CMD-check.yaml for the full
          # rationale — never loaded, cairn D-015, drags in the Stan stack).
          # covr runs the suite with NOT_CRAN set, so the skip_on_cran oracles
          # DO run here and need OpenMx/glmmTMB/lavaan — hence the allowlist is
          # the same DESCRIPTION-Suggests-minus-brms mirror as the check job,
          # plus covr + xml2. Keep the two allowlists in sync. cairn M52.
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::xml2
            any::ggrepel
            any::glmmTMB
            any::kableExtra
            any::knitr
            any::lavaan
            any::OpenMx
            any::psych
            any::RColorBrewer
            any::rmarkdown
            any::roxygen2
            any::testthat
            any::vdiffr

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        with:
          # Always true: this workflow now runs only on push (see the header),
          # which is the branch of the old event conditional that evaluated
          # true. cairn M95.
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
