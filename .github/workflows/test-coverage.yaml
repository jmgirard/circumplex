# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Push to the default branch ONLY (cairn M95). This job ran on pull requests
# too, which meant every PR ran the whole suite twice — once under
# R-CMD-check.yaml and again here under covr instrumentation, the slower of the
# two (27 min against the check job's 38 min for a three-platform escalation;
# measured 2026-08-18 from runs 32184165512 and 32184165497). Nothing was lost
# on the PR side by stopping: codecov.yml sets `comment: false` and marks both
# statuses `informational: true`, so Codecov never commented on a PR and never
# gated one, and PROFILE.md's test-doctrine has always held covr to be a
# diagnostic rather than a gate.
#
# What the PR side DID lose is this job's distinct test ENVIRONMENT — covr
# instruments the code (perturbing optimizer results, M59) and installs the
# package without vignettes (M92, where that is exactly what CI caught and no
# local run could). That signal now lands only here, on master, after the
# merge. It is not unwatched: PROFILE.md's consistency-gate requires the most
# recent completed push run of this workflow to have concluded success, so a
# red here fails the next milestone's review gate.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'man/**'
      - 'README.md'

name: test-coverage.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # brms is deliberately excluded (see R-CMD-check.yaml for the full
          # rationale — never loaded, cairn D-015, drags in the Stan stack).
          # covr runs the suite with NOT_CRAN set, so the skip_on_cran oracles
          # DO run here and need OpenMx/glmmTMB/lavaan — hence the allowlist is
          # the same DESCRIPTION-Suggests-minus-brms mirror as the check job,
          # plus covr + xml2. Keep the two allowlists in sync. cairn M52.
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::xml2
            any::ggrepel
            any::glmmTMB
            any::kableExtra
            any::knitr
            any::lavaan
            any::OpenMx
            any::psych
            any::RColorBrewer
            any::rmarkdown
            any::roxygen2
            any::testthat
            any::vdiffr

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        with:
          # Always true: this workflow now runs only on push (see the header),
          # which is the branch of the old event conditional that evaluated
          # true. cairn M95.
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
