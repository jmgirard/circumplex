# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'man/**'
      - 'README.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
      - 'man/**'
      - 'README.md'

name: R-CMD-check.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every os/R config literal lives in tools/ci-matrix.R, nowhere in this
  # file (cairn M93). Push -> full five-config matrix; PR touching the
  # script's escalation set -> the three release platforms; other PR -> the
  # single ubuntu-release job (M51's economy). A failure here fails the run:
  # there is no fallback matrix.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.classify.outputs.config }}
    steps:
      - uses: actions/checkout@v7

      - name: List the PR's changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' > changed-files.txt

      - name: Classify the run
        id: classify
        run: |
          config=$(Rscript tools/ci-matrix.R "${{ github.event_name }}" changed-files.txt)
          echo "config=$config" >> "$GITHUB_OUTPUT"

  R-CMD-check:
    needs: matrix
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix.outputs.config) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # brms is a declared Suggest but is never installed on CI (see the
      # setup-r-dependencies step below), so R CMD check must treat it as
      # skippable rather than erroring on "suggested but not available".
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Runs BEFORE the dependency install, so a drifted allowlist fails the
      # job instead of silently skipping the package it forgot
      # (_R_CHECK_FORCE_SUGGESTS_ is false below — cairn M52/M58). Base R only,
      # so it needs nothing installed beyond the R set up above.
      - name: Check CI dependency allowlists match DESCRIPTION
        run: Rscript tools/check-ci-deps.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # brms is deliberately excluded from the CI install. It is never
          # loaded by package code, tests, or vignette build — the Bayesian
          # vignette's brm() chunk is eval = FALSE and ships a committed .rds
          # fixture (cairn D-015) — yet it pulls in the whole Stan toolchain
          # (rstan/StanHeaders/RcppParallel/BH), the heaviest compile in the
          # tree. So instead of `needs: check` (which resolves ALL Suggests),
          # we install hard deps + an explicit allowlist that MUST stay a
          # mirror of DESCRIPTION Suggests minus brms. See cairn milestone M52.
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::covr
            any::ggrepel
            any::glmmTMB
            any::kableExtra
            any::knitr
            any::lavaan
            any::OpenMx
            any::psych
            any::RColorBrewer
            any::rmarkdown
            any::roxygen2
            any::testthat
            any::vdiffr

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
